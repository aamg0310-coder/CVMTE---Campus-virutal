{% load static %}
<article class="card_catalogo" data-categoria="{{ ruta.categoria.slug|default:''|lower }}" data-titulo="{{ ruta.titulo|lower }}" data-descripcion="{{ ruta.descripcion|lower|truncatechars:200 }}">
    <header>
        {% if ruta.img %}
        <img src="{{ ruta.img.url }}" alt="{{ ruta.titulo }}" loading="lazy">
        {% endif %}
    </header>
    <footer class="content_card">
        <span class="categoria_card">{{ ruta.categoria.nombre|default:"Sin categoría" }}</span>
        <h3 class="titulo_card">{{ ruta.titulo }}</h3>
        <p class="parrafo_card">{{ ruta.descripcion_corta|default:ruta.descripcion|truncatechars:160 }}</p>
        <div class="footer_card">
            <div class="puntuacion">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-star-fill" viewBox="0 0 16 16">
                    <path d="M3.612 15.443c-.386.198-.824-.149-.746-.592l.83-4.73L.173 6.765c-.329-.314-.158-.888.283-.95l4.898-.696L7.538.792c.197-.39.73-.39.927 0l2.184 4.327 4.898.696c.441.062.612.636.282.95l-3.522 3.356.83 4.73c.078.443-.36.79-.746.592L8 13.187l-4.389 2.256z" />
                </svg>
                <small>{{ ruta.puntuacion }}</small>
            </div>
            <small class="nivel">{{ ruta.nivel }}</small>
            <div class="ver">
                <a href="{% url 'main:detalle_ruta_slug' ruta.slug|default:ruta.id %}">Ver</a>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-right" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M1 8a.5.5 0 0 1 .5-.5h11.793l-3.147-3.146a.5.5 0 0 1 .708-.708l4 4a.5.5 0 0 1 0 .708l-4 4a.5.5 0 0 1-.708-.708L13.293 8.5H1.5A.5.5 0 0 1 1 8" />
                </svg>
            </div>
        </div>
    </footer>
</article>
