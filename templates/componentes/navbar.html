{% load static %}

<nav class="navbar" id="main-navbar">
    <div class="navbar-container">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" class="bi bi-code" viewBox="0 0 16 16">
                <path d="M5.854 4.854a.5.5 0 1 0-.708-.708l-3.5 3.5a.5.5 0 0 0 0 .708l3.5 3.5a.5.5 0 0 0 .708-.708L2.707 8zm4.292 0a.5.5 0 0 1 .708-.708l3.5 3.5a.5.5 0 0 1 0 .708l-3.5 3.5a.5.5 0 0 1-.708-.708L13.293 8z" />
            </svg>
            <div>
                <a href="{% url 'main:inicio' %}">CVMTE</a>
                <small>Música y Tecnología</small>
            </div>
        </div>

        <button class="navbar-toggle" id="navbar-toggle" aria-label="Abrir menú de navegación" aria-expanded="false">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <div class="navbar-menu" id="navbar-menu">
            <ul class="list_navbar">
                <li class="item_list {% if request.resolver_match.url_name == 'inicio' %}item_seleccionado{% endif %}">
                    <a href="{% url 'main:inicio' %}">Inicio</a>
                </li>
                <li class="item_list {% if request.resolver_match.url_name == 'catalogo' %}item_seleccionado{% endif %}">
                    <a href="{% url 'main:catalogo' %}">Catálogo</a>
                </li>
            </ul>

            <div class="navbar-auth">
                {% if user.is_authenticated %}
                    <a href="{% url 'main:perfil' %}" class="btn btn-panel">👤 {{ user.username }}</a>
                    <form method="post" action="{% url 'main:logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-1 btn-logout">Salir</button>
                    </form>
                {% else %}
                    <a href="{% url 'main:login' %}" class="btn btn-panel">Iniciar sesión</a>
                    <a href="{% url 'main:registro' %}" class="btn btn-1">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<script>
(function() {
    function initNav() {
        var toggle = document.getElementById('navbar-toggle');
        var menu = document.getElementById('navbar-menu');
        if (toggle && menu) {
            toggle.addEventListener('click', function(e) {
                e.stopPropagation();
                var expanded = toggle.getAttribute('aria-expanded') === 'true';
                toggle.setAttribute('aria-expanded', !expanded);
                menu.classList.toggle('active');
                toggle.classList.toggle('active');
            });
            document.addEventListener('click', function(e) {
                if (menu.classList.contains('active') && !menu.contains(e.target) && !toggle.contains(e.target)) {
                    menu.classList.remove('active');
                    toggle.classList.remove('active');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            });
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initNav);
    } else {
        initNav();
    }
})();
</script>
